<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Q4 2025 Net Payout Dashboard</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f2; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#6f6e69;
  --grid:#e8e7e3; --axis:#c3c2b7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good-text:#006300; --critical-text:#b02a2a;
  --neutral-bar:#8a8983; --accent:#2a78d6; --accent-soft:#e3eefb;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#33332f;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#a3a29a;
    --grid:#2b2b28; --axis:#4a4a45;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-text:#4fc94f; --critical-text:#ef7b7b;
    --neutral-bar:#76756f; --accent:#3987e5; --accent-soft:#1d2c40;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#33332f;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#a3a29a;
  --grid:#2b2b28; --axis:#4a4a45;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-text:#4fc94f; --critical-text:#ef7b7b;
  --neutral-bar:#76756f; --accent:#3987e5; --accent-soft:#1d2c40;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.login-card h1{font-size:20px;margin:0 0 20px}
.login-card p{margin:0 0 20px;color:var(--text-2)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.field input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn-primary{width:100%;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn-primary:disabled{opacity:.6;cursor:wait}
.err{color:var(--critical-text);font-size:13px;min-height:20px;margin-top:10px}
.err:empty{display:none}
.lock-note{font-size:12px;color:var(--text-3);margin-top:14px}

.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:22px;margin:0;letter-spacing:-.01em}
header.top .sub{color:var(--text-2);margin-top:2px}
.ghost{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--text-2)}
.ghost:hover{background:var(--surface-2)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:0;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600}
.tabs button.act{color:var(--text);border-bottom-color:var(--accent)}

.slicers{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:16px}
.mtiles{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.mtiles span{font-size:12px;color:var(--text-2);font-weight:600;padding:6px 10px;border-right:1px solid var(--border);display:flex;align-items:center}
.mtiles button{border:0;background:none;padding:6px 14px;cursor:pointer;border-right:1px solid var(--border)}
.mtiles button:last-child{border-right:0}
.mtiles button.on{background:var(--accent);color:#fff;font-weight:600}
.ms{position:relative}
.ms>button{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.ms>button b{font-size:12px;color:var(--text-2)}
.ms>button.on{border-color:var(--accent);background:var(--accent-soft)}
.ms-pop{position:absolute;top:calc(100% + 4px);left:0;min-width:230px;max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;z-index:30}
.ms-pop input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px;background:var(--surface)}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.ms-opt:hover{background:var(--surface-2)}
.ms-opt span{flex:1}
.hint{font-size:12px;color:var(--text-3);margin-left:auto}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:600}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--text-3)}
.up{color:var(--good-text)} .down{color:var(--critical-text)}
@media (max-width:1100px){.kpis,.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid .full{grid-column:1/-1}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:15px}
.card .cap{color:var(--text-2);font-size:13px;margin:2px 0 10px}
.chart{width:100%;min-height:120px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--text-3);padding:28px 0;text-align:center}

.tbl-wrap{overflow:auto;max-height:440px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);color:var(--text-2);font-weight:600;font-size:12px}
th.r,td.r{text-align:right}
tr.tot td{font-weight:650;border-top:2px solid var(--axis);position:sticky;bottom:0;background:var(--surface)}
tbody tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer}

.unused-ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.unused-ins{grid-template-columns:1fr}}
.ins article{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:12px;padding:16px 18px}
.ins h3{margin:0 0 10px;font-size:16px;line-height:1.35}
.ins .n{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:0 7px;margin-right:8px;font-size:13px}
.ins dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0}
.ins dt{color:var(--text-2);font-weight:600;font-size:13px}
.ins dd{margin:0}
.ins .go{margin-top:12px}
@media (max-width:600px){.ins dl{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--text-2);line-height:1.6}
.note b{color:var(--text)}

#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px 10px;font-size:12px;max-width:300px;display:none}
#tip .t{font-weight:650;margin-bottom:4px}
#tip .row{display:flex;gap:12px;justify-content:space-between}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
svg text{fill:var(--text-2);font-size:11px}
svg .val{fill:var(--text);font-size:11px;font-weight:600}
footer{color:var(--text-3);font-size:12px;margin-top:24px}
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>Q4 2025 Net Payout Dashboard</h1>
    <label class="field"><span>Username</span><input id="u" name="username" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn-primary" id="loginBtn" type="submit">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<div id="app" hidden></div>
<div id="tip"></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(user, pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(user.trim().toLowerCase()+":"+pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.s), iterations:PAYLOAD.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.i)}, key, b64(PAYLOAD.c));
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
  btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
  let data = null;
  try{ data = await decrypt(document.getElementById("u").value, document.getElementById("p").value); }
  catch(ex){
    await new Promise(r => setTimeout(r, 600));
    err.textContent = (window.crypto && crypto.subtle) ? "Incorrect username or password." : "Your browser blocks encryption on this page. Please open it over https.";
  }
  btn.disabled = false; btn.textContent = "Sign in";
  if (data){
    document.getElementById("app").innerHTML = data.html;
    document.getElementById("login").hidden = true;
    document.getElementById("app").hidden = false;
    start(data);
  }
});

/* ---------- formatting ---------- */
const fUSD = v => { const a = Math.abs(v), s = v < 0 ? "−" : "";
  return a >= 1e6 ? s+"$"+(a/1e6).toFixed(2)+"M" : a >= 1e3 ? s+"$"+(a/1e3).toFixed(1)+"K" : s+"$"+a.toFixed(2); };
const fUSDfull = v => (v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const fUSD0 = v => (v<0?"−":"")+"$"+Math.round(Math.abs(v)).toLocaleString("en-US");
const fUSDax = v => { const a = Math.abs(v); return a >= 1e6 ? "$"+(+(a/1e6).toFixed(2))+"M" : a >= 1e3 ? "$"+(+(a/1e3).toFixed(1))+"K" : "$"+(+a.toFixed(2)); };
const fPPO = v => isFinite(v) ? "$"+v.toFixed(2) : "–";
const fN = v => Math.round(v).toLocaleString("en-US");
const fPct = (v, d=1) => isFinite(v) ? (v*100).toFixed(d)+"%" : "–";
const fChg = v => !isFinite(v) ? "–" : (v>0?"+":v<0?"−":"")+Math.abs(v*100).toFixed(1)+"%";
const signed = (v, f) => (v > 0 ? "+" : "") + f(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mLabel = (ym, long) => { const [y,m] = ym.split("-"); return MONTHS[+m-1] + (long ? " "+y : ""); };

const C = {M:0, PROV:1, CTRY:2, TYPE:3, OFFER:4, PM:5, O:6, P:7, A:8};

  {c:C.TYPE, key:"order_type", name:"Order type"},
  {c:C.PROV, key:"provider", name:"Provider"},

];

// rows passing the dimension slicers; month: true = apply month slicer; anom: "clean" | "all" | "anom"
function rows({month=true, anom="clean", only=null} = {}){
  const out = [];
  outer: for (const r of R){
    if (anom === "clean" && r[C.A]) continue;
    if (anom === "anom" && !r[C.A]) continue;
    if (only !== null){ if (r[C.M] !== only) continue; }
    else if (month && S.months.size && !S.months.has(r[C.M])) continue;
    for (const sl of SLICERS){ const s = S.sel[sl.c]; if (s && !s.has(r[sl.c])) continue outer; }
    out.push(r);
  }
  return out;
}
function sum(rs){ let o=0,p=0; for (const r of rs){ o+=r[C.O]; p+=r[C.P]; } return {o,p}; }
function groupBy(rs, c){ const m = new Map(); for (const r of rs){ let g = m.get(r[c]); if(!g){g={o:0,p:0,n:0}; m.set(r[c],g);} g.o+=r[C.O]; g.p+=r[C.P]; g.n++; } return m; }
function group2(rs, c1, c2){ const m = new Map(); for (const r of rs){ const k = r[c1]+"|"+r[c2]; let g = m.get(k); if(!g){g={o:0,p:0}; m.set(k,g);} g.o+=r[C.O]; g.p+=r[C.P]; } return m; }
const get = (m, k) => m.get(k) || {o:0, p:0, n:0};
const idx = (c, v) => D.dict[D.dims[c]].indexOf(v);

let tip;
function showTip(html, ev){
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = Math.max(8,x)+"px"; tip.style.top = Math.max(8,y)+"px";
}
const hideTip = () => tip.style.display = "none";

function el(tag, attrs={}, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function niceMax(v){ if (v <= 0) return 1; const e = 10**Math.floor(Math.log10(v)), f = v/e; return (f<=1?1:f<=1.5?1.5:f<=2?2:f<=2.5?2.5:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10)*e; }
function svgFor(host, h){ host.innerHTML = ""; const w = Math.max(280, host.clientWidth); const s = el("svg", {width:w, height:h, viewBox:`0 0 ${w} ${h}`, role:"img"}, host); return [s, w]; }
function topRoundedRect(x, y, w, h, r){ r = Math.min(r, h, w/2); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function rightRoundedRect(x, y, w, h, r){ r = Math.min(r, w, h/2); return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`; }
function yAxis(s, x0, x1, y0, y1, lo, hi, fmt){
  for (let i=0;i<=4;i++){
    const v = lo + (hi-lo)*i/4, y = y0 - (y0-y1)*i/4;
    el("line", {x1:x0, x2:x1, y1:y, y2:y, stroke: (i===0 || Math.abs(v)<1e-9) ? cssv("--axis") : cssv("--grid"), "stroke-width":1}, s);
    el("text", {x:x0-6, y:y+4, "text-anchor":"end"}, s).textContent = Math.abs(v)<1e-9 ? "0" : fmt(v);
  }
}
function inkOn(hex){ const m = hex.replace("#",""); const [r,g,b] = [0,2,4].map(i => parseInt(m.slice(i,i+2),16)/255).map(c => c <= 0.03928 ? c/12.92 : ((c+0.055)/1.055)**2.4);
  const L = 0.2126*r + 0.7152*g + 0.0722*b; return (1.05)/(L+0.05) >= (L+0.05)/0.05 ? "#ffffff" : "#0b0b0b"; }
function legend(host, items){ host.innerHTML = items.map(it => `<span><i style="background:${it.color}"></i>${esc(it.name)}</span>`).join(""); }

function stackedCols(host, cats, series, {pct=false, h=300} = {}){
  const [s, W] = svgFor(host, h);
  const L = pct ? 44 : 58, Rm = 10, T = 22, B = 26, x0 = L, x1 = W - Rm, y0 = h - B, y1 = T;
  const totals = cats.map((_, i) => series.reduce((a, se) => a + Math.max(0, se.values[i]), 0));
  const max = pct ? 1 : niceMax(Math.max(...totals, 1));
  yAxis(s, x0, x1, y0, y1, 0, max, pct ? (v => Math.round(v*100)+"%") : fUSDax);
  const band = (x1-x0)/cats.length, bw = Math.min(84, band*0.56);
  cats.forEach((cat, i) => {
    const cx = x0 + band*i + band/2; let acc = 0;
    const tot = totals[i] || 1;
    const vis = series.filter(se => se.values[i] > 0);
    vis.forEach((se, j) => {
      const v = pct ? se.values[i]/tot : se.values[i];
      const ya = y0 - (acc/max)*(y0-y1), yb = y0 - ((acc+v)/max)*(y0-y1); acc += v;
      const hh = Math.max(0, ya - yb);
      const shape = j === vis.length-1 ? el("path", {d: topRoundedRect(cx-bw/2, yb, bw, hh, 4)}, s) : el("rect", {x:cx-bw/2, y:yb, width:bw, height:hh}, s);
      shape.setAttribute("fill", se.color); shape.setAttribute("stroke", cssv("--surface")); shape.setAttribute("stroke-width", 2);
      if (pct && hh > 18 && bw > 34){ const t = el("text", {x:cx, y:yb+hh/2+4, "text-anchor":"middle", style:`fill:${inkOn(se.color)};font-weight:600`}, s); t.textContent = Math.round(v*100)+"%"; }
      const hit = el("rect", {x:cx-band/2+2, y:yb, width:band-4, height:Math.max(hh,6), fill:"transparent"}, s);
      hit.addEventListener("mousemove", ev => showTip(`<div class="t">${esc(cat)} · ${esc(se.name)}</div>`+tipRow("Net payout", fUSDfull(se.values[i]), se.color)+tipRow("Share of month", fPct(se.values[i]/tot)), ev));
      hit.addEventListener("mouseleave", hideTip);
    });
    if (!pct){ const t = el("text", {x:cx, y:y0 - (totals[i]/max)*(y0-y1) - 6, "text-anchor":"middle", class:"val"}, s); t.textContent = fUSD(totals[i]); }
    el("text", {x:cx, y:h-8, "text-anchor":"middle"}, s).textContent = cat;
  });
}

function lineChart(host, cats, series, {fmt=fPPO, h=300} = {}){
  const [s, W] = svgFor(host, h);
  const L = 52, Rm = 84, T = 18, B = 26, x0 = L, x1 = W - Rm, y0 = h - B, y1 = T;
  const all = series.flatMap(se => se.values.filter(isFinite));
  const max = niceMax(Math.max(...all, 1));
  yAxis(s, x0, x1, y0, y1, 0, max, v => "$"+Math.round(v));
  const xs = i => cats.length === 1 ? (x0+x1)/2 : x0 + 24 + (x1-x0-48)*i/(cats.length-1);
  const ys = v => y0 - (v/max)*(y0-y1);
  cats.forEach((c,i) => el("text", {x:xs(i), y:h-8, "text-anchor":"middle"}, s).textContent = c);
  const ends = [];
  series.forEach(se => {
    const pts = se.values.map((v,i) => isFinite(v) ? [xs(i), ys(v)] : null).filter(Boolean);
    if (pts.length > 1) el("path", {d:"M"+pts.map(p=>p.join(",")).join("L"), fill:"none", stroke:se.color, "stroke-width":2, "stroke-linejoin":"round"}, s);
    pts.forEach(p => el("circle", {cx:p[0], cy:p[1], r:4.5, fill:se.color, stroke:cssv("--surface"), "stroke-width":2}, s));
    if (pts.length) ends.push({y:pts[pts.length-1][1], x:pts[pts.length-1][0], se, v:se.values[se.values.length-1]});
  });
  ends.sort((a,b) => a.y-b.y);
  for (let i=1;i<ends.length;i++) if (ends[i].y - ends[i-1].y < 14) ends[i].y = ends[i-1].y + 14;
  ends.forEach(e => { const t = el("text", {x:e.x+10, y:e.y+4}, s); t.textContent = e.se.name+" "+fmt(e.v); });
  const cross = el("line", {y1:y1, y2:y0, stroke:cssv("--axis"), "stroke-width":1, visibility:"hidden"}, s);
  cats.forEach((c,i) => {
    const w = cats.length === 1 ? (x1-x0) : (x1-x0-48)/(cats.length-1);
    const hit = el("rect", {x:xs(i)-w/2, y:y1, width:w, height:y0-y1, fill:"transparent"}, s);
    hit.addEventListener("mousemove", ev => { cross.setAttribute("x1", xs(i)); cross.setAttribute("x2", xs(i)); cross.setAttribute("visibility","visible");
      showTip(`<div class="t">${esc(c)}</div>`+series.map(se => tipRow(se.name, fmt(se.values[i]), se.color)).join(""), ev); });
    hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility","hidden"); hideTip(); });
  });
}

function hBars(host, items, {fmt=fUSD, onClick=null, active=null, sub=null, color=null} = {}){
  if (!items.length){ host.innerHTML = '<div class="empty">No data for the current filters</div>'; return; }
  const rowH = 26, h = items.length*rowH + 10;
  const [s, W] = svgFor(host, h);
  const LBL = Math.min(130, W*0.3), VAL = 80, x0 = LBL, x1 = W - VAL;
  const max = Math.max(...items.map(d => d.value), 1);
  const base = color || cssv("--s1"), dim = cssv("--axis");
  items.forEach((d, i) => {
    const y = 4 + i*rowH, bw = Math.max(2, (Math.max(0,d.value)/max)*(x1-x0));
    const isOn = !active || active.has(d.key);
    el("text", {x:x0-8, y:y+rowH/2+3, "text-anchor":"end"}, s).textContent = d.label;
    el("path", {d: rightRoundedRect(x0, y+4, bw, rowH-10, 4), fill: isOn ? base : dim}, s);
    el("text", {x:x0+bw+6, y:y+rowH/2+3, class:"val"}, s).textContent = fmt(d.value);
    const hit = el("rect", {x:0, y:y, width:W, height:rowH, fill:"transparent", style: onClick ? "cursor:pointer" : ""}, s);
    hit.addEventListener("mousemove", ev => showTip(`<div class="t">${esc(d.label)}</div>`+(sub ? sub(d) : tipRow("Value", fmt(d.value))) + (onClick ? '<div style="color:var(--text-3);margin-top:4px">Click to filter</div>' : ""), ev));
    hit.addEventListener("mouseleave", hideTip);
    if (onClick) hit.addEventListener("click", () => { hideTip(); onClick(d); });
  });
}

// waterfall: steps [{label, value, kind:"total"|"delta", color}]
function waterfall(host, steps, {h=320} = {}){
  const [s, W] = svgFor(host, h);
  const L = 58, Rm = 8, T = 22, B = 42, x0 = L, x1 = W - Rm, y0 = h - B, y1 = T;
  let run = 0; const bars = steps.map(st => {
    if (st.kind === "total"){ run = st.value; return {...st, a:0, b:st.value}; }
    const a = run; run += st.value; return {...st, a, b:run};
  });
  const max = niceMax(Math.max(...bars.map(b => Math.max(b.a,b.b)), 1));
  yAxis(s, x0, x1, y0, y1, 0, max, fUSDax);
  const ys = v => y0 - (v/max)*(y0-y1);
  const band = (x1-x0)/bars.length, bw = Math.min(46, band*0.66);
  bars.forEach((b, i) => {
    const cx = x0 + band*i + band/2, top = ys(Math.max(b.a,b.b)), bot = ys(Math.min(b.a,b.b));
    el("rect", {x:cx-bw/2, y:top, width:bw, height:Math.max(2, bot-top), rx:3, fill:b.color || cssv("--neutral-bar")}, s);
    if (i < bars.length-1){ const nx = x0 + band*(i+1) + band/2; el("line", {x1:cx+bw/2, x2:nx-bw/2, y1:ys(b.b), y2:ys(b.b), stroke:cssv("--axis"), "stroke-dasharray":"3 3"}, s); }
    if (b.kind === "total"){ el("text", {x:cx, y:top-6, "text-anchor":"middle", class:"val"}, s).textContent = fUSD(b.value); }
    else if (band > 52){ el("text", {x:cx, y:top-6, "text-anchor":"middle", class:"val"}, s).textContent = signed(b.value, fUSD); }
    b.label.split("\n").forEach((ln, k) => { el("text", {x:cx, y:h-B+16+k*13, "text-anchor":"middle"}, s).textContent = ln; });
    const hit = el("rect", {x:cx-band/2, y:y1, width:band, height:y0-y1, fill:"transparent"}, s);
    hit.addEventListener("mousemove", ev => showTip(`<div class="t">${esc(b.label.replace("\n"," · "))}</div>`+tipRow(b.kind==="total"?"Net payout":"Change", b.kind==="total"?fUSDfull(b.value):signed(b.value, fUSDfull), b.color), ev));
    hit.addEventListener("mouseleave", hideTip);
  });
}

// table: cols [{l, r, f(row)}]; rows; total row
function table(host, cols, rws, total=null, {onRow=null} = {}){
  if (!rws.length){ host.innerHTML = '<div class="empty">No data for the current filters</div>'; return; }
  host.innerHTML = `<table><thead><tr>${cols.map(c => `<th class="${c.r?"r":""}">${esc(c.l)}</th>`).join("")}</tr></thead><tbody>${
    rws.map((r,i) => `<tr data-i="${i}" class="${onRow?"click":""}">${cols.map(c => `<td class="${c.r?"r num":""} ${c.cls?c.cls(r):""}">${c.f(r)}</td>`).join("")}</tr>`).join("")
  }${total ? `<tr class="tot">${cols.map(c => `<td class="${c.r?"r num":""}">${c.t ? c.t(total) : ""}</td>`).join("")}</tr>` : ""}</tbody></table>`;
  if (onRow) host.querySelectorAll("tbody tr[data-i]").forEach(tr => tr.onclick = () => onRow(rws[+tr.dataset.i]));
}
const sgnCls = v => !isFinite(v) || Math.abs(v) < 1e-9 ? "" : v > 0 ? "up" : "down";

/* ---------- slicers ---------- */
function buildSlicers(){
  const host = document.getElementById("slicers"); host.innerHTML = "";
  const mt = document.createElement("div"); mt.className = "mtiles";
  mt.innerHTML = `<span>Month</span>` + D.dict.month.map((m,i) => `<button type="button" data-m="${i}">${mLabel(m, true)}</button>`).join("");
  mt.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const i = +b.dataset.m;
    if (e.ctrlKey || e.metaKey){ S.months.has(i) ? S.months.delete(i) : S.months.add(i); }
    else if (S.months.size === 1 && S.months.has(i)) S.months.clear();
    else { S.months.clear(); S.months.add(i); }
    renderAll(); });
  host.appendChild(mt);
  for (const sl of SLICERS){
    const wrap = document.createElement("div"); wrap.className = "ms";
    const btn = document.createElement("button"); btn.type = "button"; btn.dataset.c = sl.c;
    const pop = document.createElement("div"); pop.className = "ms-pop"; pop.hidden = true;
    btn.onclick = e => { e.stopPropagation(); const open = pop.hidden; document.querySelectorAll(".ms-pop").forEach(p => p.hidden = true); if (open){ drawPop(pop, sl); pop.hidden = false; const q = pop.querySelector("input[type=search]"); if (q) q.focus(); } };
    pop.onclick = e => e.stopPropagation();
    wrap.append(btn, pop); host.appendChild(wrap);
  }
  const reset = document.createElement("button"); reset.className = "ghost"; reset.type = "button"; reset.textContent = "Reset filters";
  reset.onclick = () => { resetState(); renderAll(); }; host.appendChild(reset);
  const hint = document.createElement("span"); hint.className = "hint"; hint.id = "slHint"; host.appendChild(hint);
  document.addEventListener("click", () => document.querySelectorAll(".ms-pop").forEach(p => p.hidden = true));
}
function drawPop(pop, sl){
  const vals = D.dict[D.dims[sl.c]];
  const tot = groupBy(R.filter(r => !r[C.A]), sl.c);
  const order = vals.map((v,i) => i).sort((a,b) => get(tot,b).p - get(tot,a).p);
  const searchable = vals.length > 10;
  pop.innerHTML = (searchable ? `<input type="search" placeholder="Search ${esc(sl.name.toLowerCase())}…">` : "") +
    `<label class="ms-opt"><input type="checkbox" data-all ${S.sel[sl.c] ? "" : "checked"}><span><b>All</b></span></label>` +
    order.map(i => `<label class="ms-opt" data-v="${esc(vals[i].toLowerCase())}"><input type="checkbox" data-i="${i}" ${S.sel[sl.c] && S.sel[sl.c].has(i) ? "checked" : ""}><span>${esc(vals[i])}</span></label>`).join("");
  pop.querySelector("[data-all]").onchange = () => { S.sel[sl.c] = null; renderAll(); drawPop(pop, sl); };
  pop.querySelectorAll("input[data-i]").forEach(cb => cb.onchange = () => {
    const i = +cb.dataset.i; let s = S.sel[sl.c] ? new Set(S.sel[sl.c]) : new Set();
    cb.checked ? s.add(i) : s.delete(i); S.sel[sl.c] = s.size ? s : null; renderAll(); drawPop(pop, sl); });
  const q = pop.querySelector("input[type=search]");
  if (q) q.oninput = () => { const t = q.value.trim().toLowerCase(); pop.querySelectorAll(".ms-opt[data-v]").forEach(o => o.hidden = t && !o.dataset.v.includes(t)); };
}
function syncSlicers(){
  document.querySelectorAll(".mtiles button").forEach(b => b.classList.toggle("on", S.months.has(+b.dataset.m)));
  document.querySelectorAll(".ms>button").forEach(b => { const c = +b.dataset.c, sl = SLICERS.find(x => x.c === c), s = S.sel[c];
    b.classList.toggle("on", !!s);
    b.innerHTML = `<b>${esc(sl.name)}</b> ${!s ? "All" : s.size === 1 ? esc(val(c, [...s][0])) : s.size+" selected"} ▾`; });
  document.getElementById("slHint").textContent = "Click a month to filter; Ctrl/⌘-click to pick several";
}
function toggleSel(c, i){ const s = S.sel[c]; S.sel[c] = (s && s.size === 1 && s.has(i)) ? null : new Set([i]); renderAll(); }
function resetState(){ S = {months:new Set(), sel:Object.fromEntries(SLICERS.map(sl => [sl.c, null]))}; }

/* ---------- KPI cards ---------- */
function kpis(host, items){
  host.innerHTML = items.map(k => `<div class="kpi"><div class="l">${esc(k.l)}</div><div class="v num ${k.cls||""}">${k.v}</div><div class="d">${k.d||"&nbsp;"}</div></div>`).join("");
}
function periodText(){ return S.months.size === 0 ? "Q4 2025" : [...S.months].sort().map(i => mLabel(D.dict.month[i], true)).join(", "); }

/* ---------- pages ---------- */
function renderOverview(){
  const cur = rows(), t = sum(cur);
  const bt = groupBy(cur, C.TYPE);
  const first = get(bt, idx(C.TYPE,"first")).o, rec = get(bt, idx(C.TYPE,"recurring")).p;
  let mom = NaN, momNote = "select one month";
  if (S.months.size === 1){ const m = [...S.months][0];
    if (m > 0){ const pm = sum(rows({only:m-1})).p; mom = pm ? (t.p - pm)/pm : NaN; momNote = "vs "+mLabel(D.dict.month[m-1], true); }
    else momNote = "no prior month in data"; }
  kpis(document.getElementById("kOverview"), [
    {l:"Net payout", v:fUSD(t.p), d:periodText()},
    {l:"Orders", v:fN(t.o), d:periodText()},
    {l:"Payout per order", v:fPPO(t.o ? t.p/t.o : NaN), d:"net payout ÷ orders"},
    {l:"First orders", v:fN(first), d:"new customers"},
    {l:"Recurring share", v:fPct(t.p ? rec/t.p : NaN), d:"of net payout"},
    {l:"Payout MoM %", v: isFinite(mom) ? (mom>0?"▲ ":"▼ ")+fChg(mom) : "–", cls: sgnCls(mom), d:momNote},
  ]);

  // full-quarter charts (month slicer does not filter them)
  const all = rows({month:false});
  const cats = D.dict.month.map(m => mLabel(m, true));
  const tm = group2(all, C.TYPE, C.M);
  const types = TYPE_ORDER.map(v => idx(C.TYPE, v)).filter(i => i >= 0);
  const series = types.map(ti => ({name:val(C.TYPE,ti), color:typeColor(val(C.TYPE,ti)), values:D.dict.month.map((_,mi) => get(tm, ti+"|"+mi).p)}));
  legend(document.getElementById("lgType1"), series); legend(document.getElementById("lgType2"), series); legend(document.getElementById("lgType3"), series);
  stackedCols(document.getElementById("cMonthly"), cats, series);
  lineChart(document.getElementById("cPpo"), cats, types.map(ti => ({name:val(C.TYPE,ti), color:typeColor(val(C.TYPE,ti)),
    values:D.dict.month.map((_,mi) => { const g = get(tm, ti+"|"+mi); return g.o ? g.p/g.o : NaN; })})));
  const steps = [];
  D.dict.month.forEach((m, mi) => {
    if (mi > 0) types.forEach(ti => steps.push({label:val(C.TYPE,ti), value:get(tm, ti+"|"+mi).p - get(tm, ti+"|"+(mi-1)).p, kind:"delta", color:typeColor(val(C.TYPE,ti))}));
    steps.push({label:mLabel(m, true), value:types.reduce((a,ti) => a + get(tm, ti+"|"+mi).p, 0), kind:"total"});
  });
  waterfall(document.getElementById("cWf"), steps);

  // bridge (single month only)
  const bh = document.getElementById("tBridge");
  if (S.months.size === 1 && [...S.months][0] > 0){
    const m = [...S.months][0];
    document.getElementById("bridgeTitle").textContent = `Bridge ${mLabel(D.dict.month[m-1])} → ${mLabel(D.dict.month[m], true)}: volume vs rate`;
    const c1 = groupBy(rows({only:m}), C.TYPE), c0 = groupBy(rows({only:m-1}), C.TYPE);
    const keys = types.filter(ti => get(c1,ti).o || get(c0,ti).o);
    const br = keys.map(ti => { const a = get(c0,ti), b = get(c1,ti);
      const vol = a.o ? (b.o - a.o) * a.p / a.o : b.p - a.p; return {type:val(C.TYPE,ti), o0:a.o, o1:b.o, p0:a.p, p1:b.p, vol, rate:(b.p - a.p) - vol}; });
    const T = br.reduce((s,r) => ({o0:s.o0+r.o0, o1:s.o1+r.o1, p0:s.p0+r.p0, p1:s.p1+r.p1, vol:s.vol+r.vol, rate:s.rate+r.rate}), {o0:0,o1:0,p0:0,p1:0,vol:0,rate:0});
    table(bh, [
      {l:"Order type", f:r => esc(r.type), t:() => "Total"},
      {l:"Orders PM", r:1, f:r => fN(r.o0), t:x => fN(x.o0)},
      {l:"Orders", r:1, f:r => fN(r.o1), t:x => fN(x.o1)},
      {l:"Payout PM", r:1, f:r => fUSDfull(r.p0), t:x => fUSDfull(x.p0)},
      {l:"Net payout", r:1, f:r => fUSDfull(r.p1), t:x => fUSDfull(x.p1)},
      {l:"Volume effect", r:1, f:r => signed(r.vol, fUSDfull), cls:r => sgnCls(r.vol), t:x => signed(x.vol, fUSDfull)},
      {l:"Rate effect", r:1, f:r => signed(r.rate, fUSDfull), cls:r => sgnCls(r.rate), t:x => signed(x.rate, fUSDfull)},
    ], br, T);
  } else {
    document.getElementById("bridgeTitle").textContent = "Bridge vs previous month: volume vs rate";
    bh.innerHTML = `<div class="empty">Select <b>Nov 2025</b> or <b>Dec 2025</b> on the month slicer to see the bridge.${S.months.size === 1 ? "<br>October has no prior month in the data." : ""}</div>`;
  }

  // monthly summary (filtered by the month slicer)
  const byM = groupBy(cur, C.M), allM = groupBy(all, C.M), tmCur = group2(cur, C.TYPE, C.M);
  const mrows = D.dict.month.map((m, mi) => ({mi, m})).filter(x => !S.months.size || S.months.has(x.mi)).map(({mi, m}) => {
    const g = get(byM, mi), prev = mi > 0 ? get(allM, mi-1).p : NaN;
    return {m:mLabel(m, true), p:g.p, o:g.o, ppo:g.o ? g.p/g.o : NaN, first:get(tmCur, idx(C.TYPE,"first")+"|"+mi).o,
      rec:g.p ? get(tmCur, idx(C.TYPE,"recurring")+"|"+mi).p / g.p : NaN, mom: prev ? (g.p - prev)/prev : NaN};
  });
  table(document.getElementById("tMonthly"), [
    {l:"Month", f:r => r.m, t:() => "Total"},
    {l:"Net payout", r:1, f:r => fUSDfull(r.p), t:() => fUSDfull(t.p)},
    {l:"Orders", r:1, f:r => fN(r.o), t:() => fN(t.o)},
    {l:"Payout per order", r:1, f:r => fPPO(r.ppo), t:() => fPPO(t.o ? t.p/t.o : NaN)},
    {l:"First orders", r:1, f:r => fN(r.first), t:() => fN(first)},
    {l:"Recurring share", r:1, f:r => fPct(r.rec), t:() => fPct(t.p ? rec/t.p : NaN)},
    {l:"Payout MoM %", r:1, f:r => fChg(r.mom), cls:r => sgnCls(r.mom), t:() => ""},
  ], mrows, {});
}

function renderGeo(){
  const cur = rows(), t = sum(cur);
  const byC = groupBy(cur, C.CTRY);
  const list = [...byC.entries()].map(([k,g]) => ({key:k, label:val(C.CTRY,k), value:g.p, o:g.o})).filter(d => d.value !== 0).sort((a,b) => b.value - a.value);
  hBars(document.getElementById("cTop15"), list.slice(0,15), {onClick:d => toggleSel(C.CTRY, d.key), active:S.sel[C.CTRY],
    sub:d => tipRow("Net payout", fUSDfull(d.value)) + tipRow("Share", fPct(d.value/t.p)) + tipRow("Payout per order", fPPO(d.o ? d.value/d.o : NaN))});
  let cum = 0, n80 = 0;
  const crow = list.map((d, i) => { cum += d.value; if (n80 === 0 && cum/t.p >= 0.8) n80 = i+1; return {...d, share:d.value/t.p, cum:cum/t.p}; });
  document.getElementById("paretoCap").textContent = list.length ? `${list.length} countries · ${n80 || list.length} of them make up 80% of net payout` : "";
  table(document.getElementById("tCountry"), [
    {l:"Country", f:r => esc(r.label), t:() => "Total"},
    {l:"Net payout", r:1, f:r => fUSDfull(r.value), t:() => fUSDfull(t.p)},
    {l:"Orders", r:1, f:r => fN(r.o), t:() => fN(t.o)},
    {l:"Payout per order", r:1, f:r => fPPO(r.o ? r.value/r.o : NaN), t:() => fPPO(t.o ? t.p/t.o : NaN)},
    {l:"% of total", r:1, f:r => fPct(r.share), t:() => "100.0%"},
    {l:"Cumulative share", r:1, f:r => fPct(r.cum), t:() => ""},
  ], crow, {}, {onRow:r => toggleSel(C.CTRY, r.key)});

  const byP = groupBy(cur, C.PROV);
  const plist = [...byP.entries()].map(([k,g]) => ({key:k, label:val(C.PROV,k), value:g.p, o:g.o})).sort((a,b) => b.value - a.value);
  hBars(document.getElementById("cProv"), plist, {onClick:d => toggleSel(C.PROV, d.key), active:S.sel[C.PROV],
    sub:d => tipRow("Net payout", fUSDfull(d.value)) + tipRow("Share", fPct(d.value/t.p)) + tipRow("Payout per order", fPPO(d.o ? d.value/d.o : NaN))});

  const all = rows({month:false}), pm = group2(all, C.PM, C.M);
  const pms = PM_ORDER.map(v => idx(C.PM, v)).filter(i => i >= 0);
  const pser = pms.map(pi => ({name:val(C.PM,pi), color:pmColor(val(C.PM,pi)), values:D.dict.month.map((_,mi) => get(pm, pi+"|"+mi).p)}));
  legend(document.getElementById("lgPm"), pser);
  stackedCols(document.getElementById("cPm"), D.dict.month.map(m => mLabel(m, true)), pser, {pct:true});

  const byO = groupBy(cur, C.OFFER);
  const orows = [...byO.entries()].map(([k,g]) => ({label:val(C.OFFER,k), o:g.o, p:g.p})).sort((a,b) => b.p - a.p);
  table(document.getElementById("tOffer"), [
    {l:"Offer", f:r => esc(r.label), t:() => "Total"},
    {l:"Orders", r:1, f:r => fN(r.o), t:() => fN(t.o)},
    {l:"% of orders", r:1, f:r => fPct(t.o ? r.o/t.o : NaN), t:() => "100.0%"},
    {l:"Net payout", r:1, f:r => fUSDfull(r.p), t:() => fUSDfull(t.p)},
    {l:"% of total", r:1, f:r => fPct(t.p ? r.p/t.p : NaN), t:() => "100.0%"},
    {l:"Payout per order", r:1, f:r => fPPO(r.o ? r.p/r.o : NaN), t:() => fPPO(t.o ? t.p/t.o : NaN)},
  ], orows, {});
}

function renderDQ(){
  const allR = rows({anom:"all"}), an = rows({anom:"anom"});
  const rep = sum(allR).p, a = sum(an), clean = rep - a.p;
  kpis(document.getElementById("kDq"), [
    {l:"Reported payout", v:fUSD(rep), d:"all rows"},
    {l:"Anomaly payout", v:fUSD(a.p), d:"payout per order ≥ $1,000"},
    {l:"Clean payout", v:fUSD(clean), d:"used on other pages"},
    {l:"Anomaly share", v:fPct(rep ? a.p/rep : NaN), d:"of reported payout"},
    {l:"Anomaly rows", v:fN(an.length), d:"of "+fN(allR.length)+" rows"},
  ]);
  const byP = groupBy(an, C.PROV);
  const plist = [...byP.entries()].map(([k,g]) => ({key:k, label:val(C.PROV,k), value:g.p, n:g.n})).sort((x,y) => y.value - x.value);
  hBars(document.getElementById("cDqProv"), plist, {color:cssv("--s2"), onClick:d => toggleSel(C.PROV, d.key), active:S.sel[C.PROV],
    sub:d => tipRow("Anomaly payout", fUSDfull(d.value)) + tipRow("Share of anomalies", fPct(a.p ? d.value/a.p : NaN)) + tipRow("Rows", fN(d.n))});
  const m = new Map();
  for (const r of an){ const k = (r[C.P]/r[C.O]).toFixed(2); let g = m.get(k); if (!g){ g = {ppo:+k, n:0, p:0, c:new Set()}; m.set(k,g); } g.n++; g.p += r[C.P]; g.c.add(r[C.CTRY]); }
  const arows = [...m.values()].sort((x,y) => y.p - x.p);
  const allC = new Set(an.map(r => r[C.CTRY]));
  table(document.getElementById("tDqAmt"), [
    {l:"Payout per order", f:r => fUSDfull(r.ppo), t:() => "Total"},
    {l:"Anomaly rows", r:1, f:r => fN(r.n), t:() => fN(an.length)},
    {l:"Anomaly payout", r:1, f:r => fUSDfull(r.p), t:() => fUSDfull(a.p)},
    {l:"Countries", r:1, f:r => fN(r.c.size), t:() => fN(allC.size)},
  ], arows, {});
}

function setTab(t){ TAB = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("act", b.dataset.tab === t));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== t);
}
function renderAll(){
  hideTip(); syncSlicers();
  if (TAB === "overview") renderOverview();
  else if (TAB === "geo") renderGeo();
  else if (TAB === "dq") renderDQ();
}
function start(data){
  D = data; R = data.rows; NM = D.dict.month.length; tip = document.getElementById("tip");
  document.getElementById("built").textContent = data.built;
  resetState(); buildSlicers(); setTab("overview"); renderAll();
  document.getElementById("logoutBtn").onclick = () => location.reload();
  document.getElementById("themeBtn").onclick = () => { const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = r.dataset.theme || (dark ? "dark" : "light"); r.dataset.theme = cur === "dark" ? "light" : "dark"; renderAll(); };
  document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; setTab(b.dataset.tab); renderAll(); window.scrollTo({top:0}); });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderAll, 150); });
}
</script>
